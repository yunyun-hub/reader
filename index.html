<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>批注阅读器</title>
<meta name="theme-color" content="#ECEEE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="批注阅读器">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script src="jszip.min.js"></script>
<script src="lemma.js" defer></script>
<style>
:root{
  --l-y:#C9A227;--l-g:#3E9A5A;--l-b:#3D63C9;--l-p:#C94A7C;
  --paper:#ECEEE8; --sheet:#F7F8F4; --ink:#1F2726; --muted:#66706C; --rule:#CDD2CA;
  --mark:#F2DE8E; --accent:#2F45A0; --accent-soft:#DDE2F5; --err:#9A2B2B; --ok:#2D6A4F;
  --fs:20px;
  --text:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC","Noto Serif CJK SC",serif;
  --zh:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --paper:#151918; --sheet:#1D2221; --ink:#DCE1DA; --muted:#8E9792; --rule:#333B39;
  --mark:rgba(214,182,72,.30); --accent:#A8B4F2; --accent-soft:rgba(120,140,230,.18); --err:#E08A8A; --ok:#7CC4A0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151918; --sheet:#1D2221; --ink:#DCE1DA; --muted:#8E9792; --rule:#333B39;
    --mark:rgba(214,182,72,.30); --accent:#A8B4F2; --accent-soft:rgba(120,140,230,.18); --err:#E08A8A; --ok:#7CC4A0;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar .t{font-family:var(--text);font-style:italic;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.bar select{flex:1 1 auto;min-width:0;max-width:320px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:14px}
.bar .sp{flex:1}
.ib{background:none;border:1px solid var(--rule);border-radius:6px;padding:5px 9px;font-size:14px;white-space:nowrap}
.ib:hover{border-color:var(--muted)}

.start{min-height:calc(100vh - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px}
.shelf{max-width:520px;width:100%}
.offline{max-width:520px;width:100%;text-align:center}
.offline .hint{font-size:13px;margin-top:8px}
.shelf h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.shelf h2 span{font-weight:400;color:var(--muted);font-size:13px}
.shelf ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.shelf li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.bk{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 4px;display:flex;flex-direction:column;gap:4px}
.bk:hover .bt{color:var(--accent)}
.bt{font-family:var(--text);font-size:18px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm{font-size:12.5px;color:var(--muted)}
.pb{display:block;height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:2px}
.pb i{display:block;height:100%;background:var(--accent)}
.del{background:none;border:0;color:var(--muted);font-size:13px;padding:8px}
.del:hover{color:var(--err)}
.drop{max-width:520px;width:100%;border:1.5px dashed var(--muted);border-radius:14px;padding:44px 28px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h1{font-family:var(--text);font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 14px}
.drop p{color:var(--muted);line-height:1.7;margin:0 0 22px;font-size:15px}
.pick{display:inline-block;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:11px 22px;font-size:15px}
.drop small{display:block;margin-top:16px;color:var(--muted);font-size:13px;line-height:1.6}
.resume{margin-top:14px}
.status{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.4em}
.status.bad{color:var(--err)}

.layout{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){ .layout{grid-template-columns:minmax(0,1fr) 400px} }
article{font-family:var(--text);font-size:var(--fs);line-height:1.75;max-width:34em;width:100%;margin:0 auto;padding:28px 22px 120px}
article p{margin:0 0 .9em}
article h2{font-weight:500;font-size:1.25em;line-height:1.3;margin:1.6em 0 .8em}
.s{border-radius:3px}
.s.on{background:var(--mark)}
.w{cursor:pointer;border-radius:2px}
@media (hover:hover){ .w:hover{background:var(--accent-soft)} }
.w.on{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.w.saved{text-decoration:underline dotted var(--accent);text-underline-offset:4px}
.chnav{display:flex;justify-content:space-between;gap:12px;margin-top:2.5em;font-family:var(--zh);font-size:15px}
.chnav button{background:none;border:1px solid var(--rule);border-radius:8px;padding:9px 14px}
.chnav button:disabled{opacity:.35;cursor:default}

aside{background:var(--sheet);border-left:1px solid var(--rule)}
.pin{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto;padding:20px 22px 40px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ph .tabs{display:flex;gap:4px;flex:1}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:4px 6px;font-size:14px;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.close{display:none}
.hint{color:var(--muted);font-size:14px;line-height:1.75}
.quote{font-family:var(--text);font-size:16px;line-height:1.6;border-left:3px solid var(--mark);padding:2px 0 2px 12px;margin:0 0 12px}
.quote.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.row .ib{font-size:13px;text-decoration:none;color:inherit}
.more{background:none;border:0;padding:0;color:var(--accent);font-size:13px;margin:-6px 0 12px}
.wc{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--paper)}
.hwl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hw{font-family:var(--text);font-size:24px;font-weight:600;line-height:1.2}
.ipa{font-family:var(--text);font-size:16px;color:var(--muted)}
.spk{background:none;border:1px solid var(--rule);border-radius:999px;width:30px;height:30px;padding:0;font-size:14px;line-height:28px}
.star{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:6px;padding:3px 8px;font-size:13px}
.star.on{border-color:var(--accent);color:var(--accent)}
.from{font-size:13px;color:var(--muted);margin:6px 0 2px}
.defs{margin:10px 0 0;padding:0;list-style:none}
.defs li{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.6;margin-bottom:6px}
.pos{flex:none;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-top:3px;white-space:nowrap}
.meta{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7}
.meta b{font-weight:500;color:var(--ink)}
.name{border-left:3px solid var(--accent);padding-left:8px}
.miss{color:var(--muted);font-size:14px;line-height:1.7}
.tr{font-size:15.5px;line-height:1.8;border-radius:8px;background:var(--paper);border:1px solid var(--rule);padding:12px 14px;margin-bottom:12px}
.tr .lab{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.wl{list-style:none;margin:0;padding:0}
.wl li{border-bottom:1px solid var(--rule);padding:10px 0;font-size:14px;line-height:1.6}
.wl b{font-family:var(--text);font-size:17px}
.wl .x{float:right;background:none;border:0;color:var(--muted);font-size:13px}
.wl .ctx{color:var(--muted);font-family:var(--text);font-size:14px}

mark.hl{color:inherit;border-radius:0;padding:0;background:var(--hl-bg);box-shadow:inset 0 -2px 0 var(--hl-line);cursor:pointer}
mark.hl.c-y,.dot.c-y{--hl-bg:rgba(242,205,80,.38);--hl-line:#C9A227;--dot:#E3BC3A}
mark.hl.c-g,.dot.c-g{--hl-bg:rgba(110,190,130,.30);--hl-line:#3E9A5A;--dot:#4FAE6B}
mark.hl.c-b,.dot.c-b{--hl-bg:rgba(110,150,235,.28);--hl-line:#3D63C9;--dot:#4C74D8}
mark.hl.c-p,.dot.c-p{--hl-bg:rgba(235,120,160,.28);--hl-line:#C94A7C;--dot:#DB5E8E}
mark.hl.end.has-note::after{content:"✎";font-size:.62em;vertical-align:super;margin-left:1px;color:var(--hl-line);font-family:var(--zh)}
mark.hl.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:inset 0 -2px 0 var(--hl-line),0 0 0 3px var(--hl-line)}100%{box-shadow:inset 0 -2px 0 var(--hl-line)}}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--sheet);background:var(--dot);box-shadow:0 0 0 1px var(--rule);padding:0;flex:none}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
.selbar{position:fixed;z-index:50;display:flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px}
.selbar button:not(.dot){background:none;border:0;padding:4px 6px;border-radius:6px;white-space:nowrap}
.selbar button:not(.dot):hover{background:var(--accent-soft)}
.selbar .sep{width:1px;height:20px;background:var(--rule)}
.pc{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--paper)}
.pct{font-size:12.5px;color:var(--accent);margin-bottom:6px}
.pi{padding:8px 0;border-top:1px solid var(--rule)}
.pi:first-of-type{border-top:0;padding-top:2px}
.pk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pk b{font-family:var(--text);font-size:18px}
.pk .star{margin-left:auto}
.spk.sm{width:26px;height:26px;line-height:24px;font-size:12px}
.star.sm{padding:2px 7px;font-size:12px}
.ptr{font-size:14.5px;line-height:1.65;margin-top:4px}
.online{font-size:12.5px;color:var(--muted);margin-top:10px}
.online a{color:var(--accent);margin-left:8px}
.nc{border:1px solid var(--rule);border-left:4px solid var(--hl-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;background:var(--paper)}
.nc .nq{font-family:var(--text);font-size:15px;line-height:1.55}
.nc .nn{font-size:14px;line-height:1.7;margin-top:6px;white-space:pre-wrap}
.nc .row{margin:8px 0 0}
.nl{list-style:none;margin:0;padding:0}
.nl h4{font-size:13px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.nl li{border-left:4px solid var(--hl-line);padding:6px 0 6px 10px;margin-bottom:10px}
.nl .nq{font-family:var(--text);font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nl .nn{font-size:13.5px;line-height:1.65;margin-top:4px;white-space:pre-wrap}
.nl .act{display:flex;gap:12px;margin-top:4px}
.nl .act button{background:none;border:0;padding:0;font-size:12.5px;color:var(--accent)}
.nl .act button.del{color:var(--muted)}
.colors{display:flex;gap:10px;margin:2px 0 4px}
.dlgf textarea{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;line-height:1.6;resize:vertical}
.dlgf .quote{max-height:7.5em;overflow:auto;margin:0}
.ib.danger{color:var(--err)}
dialog{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlgf{padding:22px;font-size:14.5px;line-height:1.7;display:flex;flex-direction:column;gap:8px}
.dlgf h3{margin:0;font-size:18px}
.dlgf p{margin:0 0 4px;color:var(--muted);font-size:13.5px}
.dlgf label{font-size:13px;color:var(--muted)}
.dlgf select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.dlgf input[type=range]{width:100%;accent-color:var(--accent)}
.dlgb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dlgb .sp{flex:1}
@media (max-width:959px){
  aside{position:fixed;left:0;right:0;bottom:0;z-index:30;border-left:0;border-top:1px solid var(--rule);
    border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .22s ease}
  aside.open{transform:none}
  .pin{position:static;max-height:56vh;padding:12px 18px calc(24px + env(safe-area-inset-bottom,0px))}
  .close{display:inline-block}
  .bar .t{display:none}
  body.sheet article{padding-bottom:60vh}
}
@media (prefers-reduced-motion:reduce){ aside,.toast{transition:none} }
</style>
</head>
<body>

<div class="bar hidden" id="bar">
  <span class="t" id="btitle"></span>
  <select id="chsel" aria-label="选择章节"></select>
  <span class="sp"></span>
  <button class="ib" id="fsm" aria-label="缩小字号">A−</button>
  <button class="ib" id="fsp" aria-label="放大字号">A+</button>
  <button class="ib" id="theme" aria-label="切换深色或浅色">◐</button>
  <button class="ib" id="vBtn" aria-label="朗读声音设置">🔊</button>
  <button class="ib" id="swap">书架</button>
</div>

<section class="start" id="start">
  <div class="drop" id="drop">
    <h1>把一本英文书放进来</h1>
    <p>支持 EPUB 和 TXT 文件。读的时候点任意单词查离线词典，点句子可以听发音、看翻译。</p>
    <button class="pick" id="pick">选择文件</button>
    <input type="file" id="file" accept=".epub,.txt,application/epub+zip,text/plain" hidden>
    <small>打开过的书会自动放进下面的书架。电脑上也可以直接把文件拖进这个框。<br>书和生词本只保存在这台设备上，不上传到任何地方。</small>
    <div class="status" id="status" role="status"></div>
  </div>
  <div class="shelf hidden" id="shelf"></div>
  <div class="offline hidden" id="offline"><button class="ib" id="dlAll">下载全部词典，断网也能查（约 50MB）</button><div class="hint" id="dlMsg"></div></div>
</section>

<div class="layout hidden" id="reader">
  <article id="text" lang="en"></article>
  <aside id="aside" aria-label="注解">
    <div class="pin">
      <div class="ph">
        <div class="tabs"><button class="tab on" id="tNote">注解</button><button class="tab" id="tNotes">笔记 <span id="ncnt"></span></button><button class="tab" id="tList">生词本 <span id="cnt"></span></button></div>
        <button class="ib close" id="close">收起</button>
      </div>
      <div id="panel"></div>
      <div id="notes" class="hidden"></div>
      <div id="list" class="hidden"></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="selbar hidden" id="selbar" role="toolbar" aria-label="选中文字的操作">
  <button class="dot c-y" data-c="y" aria-label="黄色划线"></button><button class="dot c-g" data-c="g" aria-label="绿色划线"></button><button class="dot c-b" data-c="b" aria-label="蓝色划线"></button><button class="dot c-p" data-c="p" aria-label="粉色划线"></button>
  <span class="sep"></span>
  <button data-a="note">笔记</button><button data-a="look">查词组</button><button data-a="copy">复制</button>
</div>
<dialog id="ndlg">
  <form method="dialog" class="dlgf">
    <h3>笔记</h3>
    <div class="quote" lang="en" id="nq"></div>
    <div class="colors" id="ncol"><button type="button" class="dot c-y" data-c="y" aria-label="黄色"></button><button type="button" class="dot c-g" data-c="g" aria-label="绿色"></button><button type="button" class="dot c-b" data-c="b" aria-label="蓝色"></button><button type="button" class="dot c-p" data-c="p" aria-label="粉色"></button></div>
    <textarea id="nt" rows="5" placeholder="写下你的理解、翻译或想法（可以不写，只保留划线）"></textarea>
    <div class="dlgb"><button value="del" class="ib danger">删除划线</button><span class="sp"></span><button value="cancel" class="ib">取消</button><button value="save" class="pick">保存</button></div>
  </form>
</dialog>
<dialog id="vdlg">
  <form method="dialog" class="dlgf">
    <h3>朗读声音</h3>
    <p>每台设备自带的语音不一样，选一个听着顺耳的。名字后面标“趣味音效”的是系统里的搞怪声音，不要选。</p>
    <label for="vSel">声音</label>
    <select id="vSel"></select>
    <label for="vRate">语速：<span id="vRateL"></span></label>
    <input type="range" id="vRate" min="0.5" max="1.3" step="0.05">
    <div class="dlgb"><button type="button" class="ib" id="vTry">🔊 试听</button><button type="button" class="ib" id="vAuto">恢复自动选择</button><span class="sp"></span><button value="ok" class="pick">完成</button></div>
  </form>
</dialog>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.replace(/\s+/g," ").trim();
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
let toastT=0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1800)}
const HINT='<p class="hint">点任意单词：查释义，并自动找出它在这句话里的固定搭配。<br>拖动选中一段文字（手机上长按后拖动）：可以划线、写笔记、查词组。<br>点句子里的标点或空白处：只选中整句。</p>';

/* ---------- offline service (only when hosted over https) ---------- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- theme ---------- */
const root=document.documentElement;
let theme=store.get("theme");
if(theme) root.dataset.theme=theme;
$("#theme").onclick=()=>{
  const dark=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  theme=dark?"light":"dark";root.dataset.theme=theme;store.set("theme",theme);
};

/* ---------- dictionary ---------- */
window.__D=window.__D||{};
const loading={};
function loadLetter(L){
  if(window.__D[L]) return Promise.resolve(window.__D[L]);
  if(loading[L]) return loading[L];
  return loading[L]=new Promise(res=>{
    const sc=document.createElement("script");sc.src="dict-"+L+".js";
    sc.onload=()=>res(window.__D[L]||{});
    sc.onerror=()=>{delete loading[L];res(null)};
    document.head.appendChild(sc);
  });
}
async function getRaw(w){

}
async function entry(w,depth){

}
function candidates(raw){
  let w=raw.toLowerCase().replace(/[’‘]/g,"'").replace(/^'+|'+$/g,"");
  const c=[w];
  const add=x=>{if(x&&x.length>1&&!c.includes(x))c.push(x)};
  add(w.replace(/'s$/,""));
  add(w.replace(/'/g,""));
  add(w.replace(/-/g,""));
  const b=w.replace(/'s$/,"");
  if(/ies$/.test(b)) add(b.slice(0,-3)+"y");
  if(/es$/.test(b)) add(b.slice(0,-2));
  if(/s$/.test(b)) add(b.slice(0,-1));
  if(/ied$/.test(b)) add(b.slice(0,-3)+"y");
  if(/ed$/.test(b)){ add(b.slice(0,-2)); add(b.slice(0,-1)); if(/(.)\1ed$/.test(b)) add(b.slice(0,-3)); }
  if(/ing$/.test(b)){ add(b.slice(0,-3)); add(b.slice(0,-3)+"e"); if(/(.)\1ing$/.test(b)) add(b.slice(0,-4)); }
  if(/ly$/.test(b)) add(b.slice(0,-2));
  if(/er$/.test(b)){ add(b.slice(0,-2)); add(b.slice(0,-1)); }
  if(/est$/.test(b)){ add(b.slice(0,-3)); add(b.slice(0,-2)); }
  if(w.includes("-")) w.split("-").forEach(add);

}
const INFL=/的(过去式|过去分词|现在分词|复数|第三人称单数|比较级|最高级)|^(过去式|过去分词|现在分词|复数)/;
async function lookup(raw){
  const w0=raw.toLowerCase().replace(/[’‘]/g,"'");
  const L=window.__L||{};
  if(L[w0]){
    const own=await entry(w0,1);
    if(!own||own.tr.length<40&&INFL.test(own.tr)){
      const base=await entry(L[w0][0],1);
      if(base&&!base.failed) return {...base,lemmaOf:w0};
    }
  }
  let offline=false;
  for(const c of candidates(raw)){
    const e=await entry(c,0);
    if(e===undefined){offline=true;continue}
    if(e) return {...e,guessed:c!==raw.toLowerCase()&&!e.lemmaOf?c:null};
  }
  return offline?{failed:true}:null;
}

const POSS=new Set(["my","your","his","her","its","our","their","one's","whose"]);
const REFL=new Set(["myself","yourself","himself","herself","itself","ourselves","yourselves","themselves","oneself"]);
const ART=new Set(["a","an","the"]);
const PH_OBJ=new Set(["sb","sth","someone","something","somebody"]);
const PH_POSS=new Set(["one's","sb's","someone's","somebody's"]);
const STOP=new Set(["a","an","the","of","to","in","on","at","by","for","with","and","or","but","is","be","it","this","that","as","from","into","i","you","he","she","we","they","not","no","so","if","all","any","some"]);
const formCache={};
async function tokForms(raw){
  const w=raw.toLowerCase().replace(/[’‘]/g,"'");
  if(formCache[w]) return formCache[w];
  const set=new Set([w]);
  const L=window.__L||{};
  (L[w]||[]).forEach(x=>set.add(x));
  for(const c of candidates(w)){
    set.add(c);
    const e=await getRaw(c);
    if(typeof e==="string"&&e[0]==="@") set.add(e.slice(1));
  }
  return formCache[w]=set;
}
function matchFrom(pw,k,toks,forms,pos){
  if(k===pw.length) return pos;
  const p=pw[k];
  const gapOk=pos<toks.length && !(pos>0 && toks[pos-1].brk);
  if(ART.has(p)){
    if(gapOk && forms[pos].has(p)){const r=matchFrom(pw,k+1,toks,forms,pos+1);if(r>0)return r}
    return matchFrom(pw,k+1,toks,forms,pos);
  }
  if(!gapOk) return -1;
  if(PH_OBJ.has(p)){
    for(let n=1;n<=3&&pos+n<=toks.length;n++){
      if(n>1&&toks[pos+n-2].brk) break;
      const r=matchFrom(pw,k+1,toks,forms,pos+n);if(r>0)return r;
    }
    return -1;
  }
  const t=toks[pos].t.toLowerCase().replace(/[’‘]/g,"'");
  if(PH_POSS.has(p)) return (POSS.has(t)||/'s$/.test(t))?matchFrom(pw,k+1,toks,forms,pos+1):-1;
  if(p==="oneself") return REFL.has(t)?matchFrom(pw,k+1,toks,forms,pos+1):-1;
  return forms[pos].has(p)?matchFrom(pw,k+1,toks,forms,pos+1):-1;
}
async function phrasesIn(toks){
  const forms=await Promise.all(toks.map(x=>tokForms(x.t)));
  const res=[],seen=new Set();
  for(let i=0;i<toks.length;i++){
    for(const f of forms[i]){
      if(!/^[a-z]/.test(f)) continue;
      const P=await loadPhr(f[0]);if(!P) continue;
      const list=P[f];if(!list) continue;
      for(const [key,tr] of list){
        if(seen.has(key)) continue;
        const pw=key.split(" ");
        if(pw.every(x=>STOP.has(x)||PH_OBJ.has(x)||PH_POSS.has(x))) continue;
        const end=matchFrom(pw,1,toks,forms,i+1);
        if(end>0){seen.add(key);res.push({key,tr,i,j:end})}
      }
    }
  }
  const lit=m=>m.key.split(" ").filter(x=>!PH_OBJ.has(x)&&!PH_POSS.has(x)&&x!=="oneself").length;
  const keep=res.filter(m=>!res.some(o=>o!==m&&o.i<=m.i&&m.j<=o.j&&((o.j-o.i)>(m.j-m.i)||lit(o)>lit(m))));
  return keep.sort((a,b)=>lit(b)-lit(a)||(b.j-b.i)-(a.j-a.i));
}

/* ---------- parsing ---------- */
function resolvePath(base,href){
  const out=[];
  for(const p of (base+href).split("/")){ if(p==="..")out.pop(); else if(p!=="."&&p!=="")out.push(p); }
  return out.join("/");
}
const SEL="p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,dt,dd";
function extractBlocks(body){
  if(!body) return [];
  body.querySelectorAll("br").forEach(b=>b.replaceWith(" "));
  body.querySelectorAll("script,style").forEach(b=>b.remove());
  let els=[...body.querySelectorAll(SEL)].filter(e=>!e.querySelector(SEL));
  if(!els.length) els=[...body.querySelectorAll("div")].filter(e=>!e.querySelector("div"));
  if(!els.length && norm(body.textContent)) els=[body];
  return els.map(e=>({text:norm(e.textContent),head:/^H\d$/.test(e.tagName)})).filter(b=>b.text);
}
async function parseEpub(buf){
  if(!window.JSZip) throw new Error("缺少 jszip.min.js 文件，请把所有文件一起上传或复制。");
  const zip=await JSZip.loadAsync(buf);
  const cf=zip.file("META-INF/container.xml"); if(!cf) throw new Error("这不是一个有效的 EPUB 文件。");
  const cdoc=new DOMParser().parseFromString(await cf.async("text"),"application/xml");
  const rf=cdoc.getElementsByTagName("rootfile")[0]; if(!rf) throw new Error("EPUB 里找不到目录信息。");
  const opfPath=rf.getAttribute("full-path");
  const opf=new DOMParser().parseFromString(await zip.file(opfPath).async("text"),"application/xml");
  const base=opfPath.includes("/")?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
  const te=opf.getElementsByTagNameNS("*","title")[0];
  const manifest={};
  for(const it of opf.getElementsByTagNameNS("*","item")) manifest[it.getAttribute("id")]={href:it.getAttribute("href")||"",type:it.getAttribute("media-type")||""};
  const chapters=[];
  for(const ref of opf.getElementsByTagNameNS("*","itemref")){
    const m=manifest[ref.getAttribute("idref")]; if(!m) continue;
    if(m.type && !/html/i.test(m.type)) continue;
    let href=m.href.split("#")[0]; try{href=decodeURIComponent(href)}catch(e){}
    const f=zip.file(resolvePath(base,href)); if(!f) continue;
    const doc=new DOMParser().parseFromString(await f.async("text"),"text/html");
    const blocks=extractBlocks(doc.body); if(!blocks.length) continue;
    const h=blocks.find(b=>b.head);
    let title=h?h.text:(blocks[0].text.length<60?blocks[0].text:"");
    if(!title) title="第 "+(chapters.length+1)+" 部分";
    if(title.length>42) title=title.slice(0,40)+"…";
    chapters.push({title,blocks});
  }
  if(!chapters.length) throw new Error("没能从这个 EPUB 里读出正文。");
  return {title:te?norm(te.textContent):"未命名的书",chapters};
}
function parseTxt(txt,name){
  let paras=txt.split(/\r?\n\s*\r?\n/).map(norm).filter(Boolean);
  if(paras.length<5) paras=txt.split(/\r?\n/).map(norm).filter(Boolean);
  const chapters=[];
  for(let i=0;i<paras.length;i+=60) chapters.push({title:"第 "+(chapters.length+1)+" 部分",blocks:paras.slice(i,i+60).map(t=>({text:t,head:false}))});
  if(!chapters.length) throw new Error("这个文本文件是空的。");
  return {title:name.replace(/\.txt$/i,""),chapters};
}

const sSeg=window.Intl&&Intl.Segmenter?new Intl.Segmenter("en",{granularity:"sentence"}):null;
const wSeg=window.Intl&&Intl.Segmenter?new Intl.Segmenter("en",{granularity:"word"}):null;
function sentences(t){
  if(sSeg) return [...sSeg.segment(t)].map(x=>x.segment.trim()).filter(Boolean);
  return (t.match(/[^.!?]+(?:[.!?]+["'”’)]*|$)/g)||[t]).map(s=>s.trim()).filter(Boolean);
}
function pieces(s){
  if(wSeg) return [...wSeg.segment(s)].map(x=>({t:x.segment,w:!!(x.isWordLike&&/[A-Za-z]/.test(x.segment))}));
  return s.split(/([A-Za-z\u00C0-\u024F]+(?:['’][A-Za-z]+)*)/).map((p,i)=>({t:p,w:i%2===1})).filter(x=>x.t);
}
function tokenize(s){
  const ps=pieces(s);const out=[];
  for(const x of ps){
    if(x.w) out.push({t:x.t,brk:false});
    else if(out.length && /[^\s\-'’]/.test(x.t)) out[out.length-1].brk=true;
  }
  return out;
}

  return pieces(s).map(x=>x.w?'<span class="w'+(saved[x.t.toLowerCase()]?" saved":"")+'">'+esc(x.t)+"</span>":esc(x.t)).join("");

async function openFile(file){

function showChapter(i,ratio){
  cur=i;$("#chsel").value=String(i);sents=[];closePanel(true);

  for(const b of ch.blocks){

    out.push(b.head?"<h2>"+inner+"</h2>":"<p>"+inner+"</p>");
  }
  out.push('<div class="chnav" lang="zh"><button id="prev"'+(i===0?" disabled":"")+'>上一部分</button><button id="next"'+(i===book.chapters.length-1?" disabled":"")+">下一部分</button></div>");

/* ---------- highlights & notes ---------- */
let notes=[];
const nKey=()=>"notes:"+bookId;
function loadNotes(){notes=store.get(nKey())||[];updateNoteCount()}
function saveNotes(){store.set(nKey(),notes);updateNoteCount()}
function updateNoteCount(){$("#ncnt").textContent=notes.length?"("+notes.length+")":""}
function noteText(n){return n.text}
function wrapRange(sEl,start,end,cls,id){
  const walker=document.createTreeWalker(sEl,NodeFilter.SHOW_TEXT);
  let pos=0,node;const parts=[];
  while((node=walker.nextNode())){
    const L=node.data.length,a=Math.max(start,pos),b=Math.min(end,pos+L);
    if(a<b) parts.push([node,a-pos,b-pos]);
    pos+=L;if(pos>=end) break;
  }
  const marks=[];
  for(const [nd,a,b] of parts){
    let t=nd;if(a>0) t=t.splitText(a);
    if(b-a<t.data.length) t.splitText(b-a);
    const m=document.createElement("mark");m.className=cls;m.dataset.n=id;
    t.parentNode.insertBefore(m,t);m.appendChild(t);marks.push(m);
  }
  return marks;
}
function paintNotes(){
  const root=$("#text");
  root.querySelectorAll("mark.hl").forEach(m=>m.replaceWith(...m.childNodes));
  root.normalize();
  for(const n of notes){
    if(n.ch!==cur) continue;
    let last=null;
    for(let k=n.s0;k<=n.s1;k++){
      const el=root.querySelector('.s[data-s="'+k+'"]');if(!el) continue;
      const a=k===n.s0?n.o0:0,b=k===n.s1?n.o1:el.textContent.length;
      const ms=wrapRange(el,a,b,"hl c-"+n.color+(n.note?" has-note":""),n.id);
      if(ms.length) last=ms[ms.length-1];
    }
    if(last) last.classList.add("end");
  }
}
function offIn(el,node,off){const r=document.createRange();r.setStart(el,0);r.setEnd(node,off);return r.toString().length}
function selInfo(){
  const se=window.getSelection();if(!se||se.isCollapsed||!se.rangeCount) return null;
  const r=se.getRangeAt(0);
  if(!$("#text").contains(r.commonAncestorContainer)) return null;
  const ss=[...$("#text").querySelectorAll(".s")].filter(x=>r.intersectsNode(x));
  if(!ss.length) return null;
  const f=ss[0],l=ss[ss.length-1];
  let s0=+f.dataset.s,s1=+l.dataset.s;
  let o0=f.contains(r.startContainer)?offIn(f,r.startContainer,r.startOffset):0;
  let o1=l.contains(r.endContainer)?offIn(l,r.endContainer,r.endOffset):l.textContent.length;
  const ft=f.textContent,lt=l.textContent;
  while(o0<ft.length&&/\s/.test(ft[o0])) o0++;
  while(o1>0&&/\s/.test(lt[o1-1])) o1--;
  if(s0===s1&&o1<=o0) return null;
  const parts=[];
  for(let k=s0;k<=s1;k++){const t=sents[k];parts.push(t.slice(k===s0?o0:0,k===s1?o1:t.length))}
  const text=parts.join(" ").trim();
  if(!text) return null;
  return {s0,o0,s1,o1,text};
}
function addNote(info,color){

    s0:info.s0,o0:info.o0,s1:info.s1,o1:info.o1,text:info.text,color:color||"y",note:"",t:Date.now()};

}

function jumpTo(n){

function renderNotes(){
  const box=$("#notes");
  if(!notes.length){box.innerHTML='<p class="hint">还没有笔记。<br>拖动选中一段文字（手机上长按单词再拖动选择范围），点颜色就能划线，点“笔记”可以写下想法。<br>也可以点一个句子，在注解里点“划线这句”。</p>';return}
  const sorted=notes.slice().sort((a,b)=>a.ch-b.ch||a.s0-b.s0||a.o0-b.o0);
  let h='<div class="row"><button class="ib" id="nExp">导出笔记（Markdown）</button><button class="ib" id="nCopy">复制全部</button></div><ul class="nl">';
  let lastCh=-1;
  for(const n of sorted){
    if(n.ch!==lastCh){h+='<h4>'+esc(book.chapters[n.ch]?book.chapters[n.ch].title:n.chTitle||"")+"</h4>";lastCh=n.ch}
    h+='<li class="c-'+n.color+'" style="--hl-line:var(--l-'+n.color+')"><div class="nq" lang="en">'+esc(n.text)+"</div>"+
      (n.note?'<div class="nn">'+esc(n.note)+"</div>":"")+
      '<div class="act"><button data-j="'+n.id+'">跳到原文</button><button data-e="'+n.id+'">'+(n.note?"编辑笔记":"写笔记")+'</button><button class="del" data-d="'+n.id+'">删除</button></div></li>';
  }
  box.innerHTML=h+"</ul>";
  const find=id=>notes.find(x=>x.id===id);
  box.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>jumpTo(find(b.dataset.j)));
  box.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>openNote(find(b.dataset.e)));
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    if(!confirm("删除这条划线和笔记？")) return;
    notes=notes.filter(x=>x.id!==b.dataset.d);saveNotes();paintNotes();renderNotes();
  });
  const md=()=>{
    let t="# 《"+book.title+"》读书笔记\n";let lc=-1;
    for(const n of sorted){
      if(n.ch!==lc){t+="\n## "+(book.chapters[n.ch]?book.chapters[n.ch].title:"")+"\n";lc=n.ch}
      t+="\n> "+n.text.replace(/\n/g," ")+"\n"+(n.note?"\n"+n.note+"\n":"");
    }
    return t;
  };
  $("#nExp").onclick=()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md()],{type:"text/markdown"}));
    a.download="《"+book.title.replace(/[\\/:*?"<>|]/g,"")+"》读书笔记.md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };

}

let selT=0,lastSel=null;
const bar=$("#selbar");
function hideBar(){bar.classList.add("hidden");lastSel=null}
function placeBar(){
  const info=selInfo();
  if(!info){hideBar();return}
  lastSel=info;
  const r=window.getSelection().getRangeAt(0).getBoundingClientRect();
  bar.classList.remove("hidden");
  const bw=bar.offsetWidth,bh=bar.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-bw/2),vw-bw-8);
  let y=r.bottom+12;
  if(y+bh>vh-8) y=Math.max(8,r.top-bh-12);
  bar.style.left=x+"px";bar.style.top=y+"px";
}
document.addEventListener("selectionchange",()=>{clearTimeout(selT);selT=setTimeout(placeBar,250)});

bar.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!lastSel) return;

  const items=Object.values(saved).sort((a,b)=>b.t-a.t);
  if(!items.length){$("#list").innerHTML='<p class="hint">还没有生词。查词时点“加入生词本”，词会连同原句一起存在这里。</p>';return}
  $("#list").innerHTML='<div class="row"><button class="ib" id="exp">导出为表格（CSV）</button></div><ul class="wl">'+
    items.map(x=>'<li><button class="x" data-k="'+esc(x.w)+'">删除</button><b lang="en">'+esc(x.w)+"</b> "+(x.ph?'<span class="ipa">/'+esc(x.ph)+"/</span>":"")+"<div>"+esc(x.d)+'</div><div class="ctx" lang="en">'+esc(x.ctx)+"</div></li>").join("")+"</ul>";
  $("#list").querySelectorAll(".x").forEach(b=>b.onclick=()=>{delete saved[b.dataset.k];store.set("words",saved);updateCount();renderList()});
  $("#exp").onclick=()=>{
    const q=v=>'"'+String(v||"").replace(/"/g,'""')+'"';
    const csv="﻿单词,音标,释义,原句,书名\n"+items.map(x=>[x.w,x.ph,x.d,x.ctx,x.book].map(q).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="生词本.csv";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}
updateCount();

/* ---------- voice dialog ---------- */
$("#vBtn").onclick=openVoice;
$("#vSel").onchange=e=>{store.set("voice",e.target.value);pickVoice();say("Hello, this is how I sound.")};
$("#vRate").oninput=e=>{rate=+e.target.value;store.set("rate",rate);$("#vRateL").textContent=rate.toFixed(2)+" 倍"};
$("#vTry").onclick=()=>say("Good morning. Shall we read a few more pages together?");
$("#vAuto").onclick=()=>{store.set("voice",null);pickVoice();openVoice();say("Hello, this is how I sound.")};

/* ---------- offline download ---------- */
const ALLFILES=[..."abcdefghijklmnopqrstuvwxyz"].flatMap(c=>["dict-"+c+".js","phr-"+c+".js"]);
if("serviceWorker" in navigator && location.protocol==="https:"){
  $("#offline").classList.remove("hidden");
  if(store.get("offlineDone")) $("#dlMsg").textContent="全部词典已经下载到这台设备上。";
  $("#dlAll").onclick=async()=>{
    const b=$("#dlAll"),m=$("#dlMsg");b.disabled=true;let done=0,fail=0;
    for(const f of ALLFILES){
      try{const r=await fetch(f);if(!r.ok&&r.status!==404) fail++;}catch(e){fail++}
      done++;m.textContent="正在下载… "+Math.round(done/ALLFILES.length*100)+"%";
    }
    b.disabled=false;
    if(fail){m.textContent="有 "+fail+" 个文件没下载成功，请连好网络后再点一次。"}
    else{m.textContent="完成！全部词典已经存到这台设备上，断网也能查。";store.set("offlineDone",true)}
  };
}

/* ---------- controls ---------- */
$("#chsel").onchange=e=>showChapter(+e.target.value,0);
let fs=store.get("fs")||20;
const applyFs=()=>root.style.setProperty("--fs",fs+"px");applyFs();
$("#fsm").onclick=()=>{fs=Math.max(15,fs-1);applyFs();store.set("fs",fs)};
$("#fsp").onclick=()=>{fs=Math.min(28,fs+1);applyFs();store.set("fs",fs)};
$("#swap").onclick=()=>{closePanel(true);$("#reader").classList.add("hidden");$("#bar").classList.add("hidden");$("#start").classList.remove("hidden");showShelf()};
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{openFile(e.target.files[0]);e.target.value=""};
const drop=$("#drop");
["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();if(t==="drop"||!e.relatedTarget)drop.classList.remove("over")}));
document.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)openFile(f)});
$("#panel").innerHTML=HINT;

function progress(m){
  const p=store.get("pos:"+hash(m.title));
  if(!p||!m.chs) return 0;
  return Math.min(100,Math.round(((p.ch||0)+(p.r||0))/m.chs*100));
}
function ago(t){
  const d=Math.floor((Date.now()-t)/86400000);
  if(d<=0) return "今天";if(d===1) return "昨天";if(d<30) return d+" 天前";
  const x=new Date(t);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();
}
async function showShelf(){
  const list=(await allMeta()).sort((a,b)=>b.opened-a.opened);
  const el=$("#shelf");
  if(!list.length){el.classList.add("hidden");return}
  el.classList.remove("hidden");
  el.innerHTML='<h2>我的书架 <span>'+list.length+' 本</span></h2><ul>'+list.map(m=>{
    const pc=progress(m);
    return '<li><button class="bk" data-id="'+esc(m.id)+'"><span class="bt" lang="en">'+esc(m.title)+'</span>'+
      '<span class="bm">'+(pc?"读到 "+pc+"%":"还没开始读")+' · 上次打开：'+ago(m.opened)+'</span>'+
      '<span class="pb"><i style="width:'+pc+'%"></i></span></button>'+
      '<button class="del" data-id="'+esc(m.id)+'" aria-label="从书架删除">删除</button></li>';
  }).join("")+"</ul>";
  el.querySelectorAll(".bk").forEach(b=>b.onclick=async()=>{
    const m=list.find(x=>x.id===b.dataset.id);
    const st=$("#status");st.className="status";st.textContent="正在打开…";
    const buf=await getFile(m.id);
    if(!buf){st.className="status bad";st.textContent="这本书的文件找不到了，请重新选择文件打开。";return}
    loadBuffer(buf,m.name,m.id);
  });
  el.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{
    const m=list.find(x=>x.id===b.dataset.id);
    if(!confirm("从书架删除《"+m.title+"》？\n阅读进度会一起删除，生词本里的词会保留。")) return;
    await delBook(m.id);try{localStorage.removeItem("pos:"+hash(m.title));localStorage.removeItem("notes:"+m.id)}catch(e){}
    showShelf();
  });
}
migrateOld().then(showShelf);
})();
</script>
</body>
</html>
